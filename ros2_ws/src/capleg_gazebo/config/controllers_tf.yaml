# ros2_control controllers - CapLeg transfemoral on the treadmill hip simulator (Gazebo Harmonic)
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    capleg_effort_controller:
      type: forward_command_controller/ForwardCommandController

    rig_position_controller:
      type: forward_command_controller/ForwardCommandController

capleg_effort_controller:
  ros__parameters:
    joints: [rig_z, knee, ankle_pitch, ankle_roll, toe]
    interface_name: effort

rig_position_controller:
  ros__parameters:
    joints: [rig_x, hip]
    interface_name: position
